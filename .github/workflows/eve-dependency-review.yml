name: Sift Eve dependency review
on:
  push:
    branches: [qa/sift-eve-20261114]
    paths: [package.json, package-lock.json, agent/**, lib/chat-archive.ts, components/SiftApp.tsx, tests/unit/*chat*.test.mjs, tests/unit/agent-channel.test.mjs, tests/unit/session-usage.test.mjs, tests/support/load-typescript.mjs, scripts/review-eve-dependency.py, .github/workflows/eve-dependency-review.yml]
permissions:
  contents: read
concurrency:
  group: sift-eve-dependency-review
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'alvarovillalbaa/sift-analytics' && github.event.repository.private == false && github.ref == 'refs/heads/qa/sift-eve-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          check-latest: false
      - name: Resolve, audit and qualify committed graph
        env:
          AUDIT_OUTPUT_DIR: ${{ runner.temp }}/sift-eve-output-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/review-eve-dependency.py
      - name: Retain bounded proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sift-eve-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sift-eve-output-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
